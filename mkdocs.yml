# Forward guard against the silence that hid the instrumentation set above.
# mkdocs logs an omitted page at INFO by default, which is off in a normal
# build: nine required-context documents sat unreachable for as long as they
# existed and no build ever said so. At `warn` an unreferenced page is named
# on every build, so the next doc that lands in Docs/ without a nav entry is
# noisy rather than silently unpublished.
#
# This warns today, on purpose, and the list is short and known:
#   SecondSight.md    -- its own first line says to leave it out for now
#   Woz.md            -- design scratch, not a finished page
#   NeilA235Floppy.md -- third-party reference text kept verbatim
#   IIgs_SHR_SCB.md   -- oracle note, wants a home under Internals
#   Serial_Modem.md   -- linked from Docs/index.md but never navigable
# Deliberately NOT paired with `strict: true`: that would turn those five into
# a hard build failure and the fix for them is an editorial decision, not this
# change's to make.
validation:
  nav:
    omitted_files: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
